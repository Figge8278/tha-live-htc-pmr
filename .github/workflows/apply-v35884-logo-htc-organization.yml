name: Apply V3.58.8.4 Logo and HTC Organization

on:
  push:
    branches:
      - feature/v3-58-native-start-snapshot-management
    paths:
      - .github/workflows/apply-v35884-logo-htc-organization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-58-native-start-snapshot-management
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused native corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('src/main.jsx')
          main = main_path.read_text()

          old_logo = """function THALogo({variant='full', className=''}) {
            const src = variant === 'icon' ? '/tha-logo-icon-black.png' : '/tha-logo-full-black.png';
            return <img className={`thaLogo ${variant} ${className}`} src={src} alt=\"The Homeowner Advocate\" />;
          }"""
          new_logo = """function THALogo({variant='full', className=''}) {
            const base = import.meta.env.BASE_URL || '/';
            const file = variant === 'icon' ? 'tha-logo-icon-black.png' : 'tha-logo-full-black.png';
            const src = `${base}${file}`;
            return <img className={`thaLogo ${variant} ${className}`} src={src} alt=\"The Homeowner Advocate\" />;
          }"""
          assert old_logo in main, 'THALogo component did not match expected source'
          main = main.replace(old_logo, new_logo, 1)

          category_order = """const CATEGORY_ORDER = [
            'Exterior & Site / Grounds',
            'Landscaping / Site & Grounds',
            'Handy Services',
            'Roofing / Gutters',
            'Painting / Staining / Protective Coatings',
            'Painting / Staining',
            'Carpentry / Decks / Fences',
            'Windows / Exterior Sealant',
            'Electrical',
            'Plumbing',
            'HVAC / Mechanical',
            'Appliances',
            'General Contractor / Remodel',
            'General Contractor / Structural',
            'Safety / Life Safety',
            'Pest',
            'Specialty / Other'
          ];"""
          main, count = re.subn(r"const CATEGORY_ORDER = \[.*?\n\];", category_order, main, count=1, flags=re.S)
          assert count == 1, f'CATEGORY_ORDER replacement count was {count}'

          category_meta = """const CATEGORY_META = {
            'Exterior & Site / Grounds': { label: 'Exterior & Site / Grounds', slug: 'exterior-site-grounds', Icon: TreePine },
            'Landscaping / Site & Grounds': { label: 'Landscaping / Site & Grounds', slug: 'landscaping-site-grounds', Icon: Leaf },
            'Handy Services': { label: 'Handy Services', slug: 'handy-services', Icon: Wrench },
            'Roofing / Gutters': { label: 'Roofing / Gutters', slug: 'roofing-gutters', Icon: Home },
            'Painting / Staining / Protective Coatings': { label: 'Painting / Staining / Protective Coatings', slug: 'painting-staining-coatings', Icon: Paintbrush },
            'Painting / Staining': { label: 'Painting / Staining', slug: 'painting-staining', Icon: Paintbrush },
            'Carpentry / Decks / Fences': { label: 'Carpentry / Decks / Fences', slug: 'carpentry-decks-fences', Icon: Hammer },
            'Windows / Exterior Sealant': { label: 'Windows / Exterior Sealant', slug: 'windows-exterior-sealant', Icon: DoorOpen },
            Electrical: { label: 'Electrical', slug: 'electrical', Icon: Plug },
            Plumbing: { label: 'Plumbing', slug: 'plumbing', Icon: Droplets },
            'HVAC / Mechanical': { label: 'HVAC / Mechanical', slug: 'hvac-mechanical', Icon: Fan },
            Appliances: { label: 'Appliances', slug: 'appliances', Icon: Settings },
            'General Contractor / Remodel': { label: 'General Contractor / Remodel', slug: 'general-contractor-remodel', Icon: HardHat },
            'General Contractor / Structural': { label: 'General Contractor / Structural', slug: 'general-contractor-structural', Icon: HardHat },
            'Safety / Life Safety': { label: 'Safety / Life Safety', slug: 'safety-life-safety', Icon: ShieldCheck },
            Pest: { label: 'Pest', slug: 'pest', Icon: Bug },
            'Specialty / Other': { label: 'Specialty / Other', slug: 'specialty-other', Icon: Search }
          };"""
          main, count = re.subn(r"const CATEGORY_META = \{.*?\n\};", category_meta, main, count=1, flags=re.S)
          assert count == 1, f'CATEGORY_META replacement count was {count}'

          legacy_map = """const LEGACY_CATEGORY_MAP = {
            Handyman: 'Handy Services',
            Electrical: 'Electrical',
            Plumbing: 'Plumbing',
            HVAC: 'HVAC / Mechanical',
            Roofing: 'Roofing / Gutters',
            Roof: 'Roofing / Gutters',
            Drainage: 'Landscaping / Site & Grounds',
            Openings: 'Windows / Exterior Sealant',
            Windows: 'Windows / Exterior Sealant',
            Exterior: 'Exterior & Site / Grounds',
            Paint: 'Painting / Staining / Protective Coatings',
            Pest: 'Pest',
            Safety: 'Safety / Life Safety',
            Appliances: 'Appliances',
            Appliance: 'Appliances',
            'Handy / Carpentry': 'Carpentry / Decks / Fences',
            'General / Misc': 'Specialty / Other',
            'General Contractor': 'General Contractor / Remodel',
            Carpentry: 'Carpentry / Decks / Fences',
            Design: 'Specialty / Other',
            Flooring: 'Specialty / Other',
            Landscape: 'Landscaping / Site & Grounds',
            Chimney: 'Roofing / Gutters'
          };"""
          main, count = re.subn(r"const LEGACY_CATEGORY_MAP = \{.*?\n\};", legacy_map, main, count=1, flags=re.S)
          assert count == 1, f'LEGACY_CATEGORY_MAP replacement count was {count}'

          main = main.replace("  const trade = item.trade || item.answer?.trade || '';", "  const trade = item.answer?.trade || item.trade || '';", 1)

          checklist_logic = """function categoryForLikelyResource(item = {}) {
            const text = categoryText(item);
            const trade = item.answer?.trade || item.trade || '';

            if (item.catchAll || text.includes('misc') || text.includes('sorting')) return 'Specialty / Other';
            if (/(dryer vent|dryer duct|vent cleaning|vent hose)/.test(text)) return 'Handy Services';
            if (/(structural|foundation|movement|load-bearing|engineering)/.test(text)) return 'General Contractor / Structural';
            if (trade === 'General Contractor' || /(remodel|renovation|permit|whole-home)/.test(text)) return 'General Contractor / Remodel';
            if (/(electrical|gfci|outlet|switch|panel|breaker|solar|lighting)/.test(text)) return 'Electrical';
            if (/(plumbing|sink|faucet|drain|toilet|water heater|shutoff|washer hose|supply line)/.test(text)) return 'Plumbing';
            if (/(hvac|furnace|heat pump|air conditioner|a\\/c|thermostat|ventilation|exhaust fan)/.test(text)) return 'HVAC / Mechanical';
            if (/(appliance|range hood|dryer|washer|refrigerator|dishwasher|garbage disposal|oven|range)/.test(text)) return 'Appliances';
            if (/(roof|gutter|downspout|flashing|shingle|chimney|fireplace|hearth|damper)/.test(text)) return 'Roofing / Gutters';
            if (/(irrigation|sprinkler|grading|pooling|landscape|hardscape|site drainage|drainage discharge)/.test(text)) return 'Landscaping / Site & Grounds';
            if (/(window|exterior sealant|glazing|fogging|failed seal|window screen)/.test(text)) return 'Windows / Exterior Sealant';
            if (/(paint|stain|coating|finish wear|drywall finish|caulk wear)/.test(text)) return 'Painting / Staining / Protective Coatings';
            if (/(carpentry|cabinet|drawer|shelving|built-in|deck|fence|gate|trim|fascia|soffit)/.test(text)) return 'Carpentry / Decks / Fences';
            if (/(safety|smoke|co detector|carbon monoxide|fire extinguisher|life safety)/.test(text)) return 'Safety / Life Safety';
            if (/(pest|bug|rodent|termite|ant|insect|entry point)/.test(text)) return 'Pest';

            const resourceCategory = {
              Handyman: 'Handy Services',
              Electrical: 'Electrical',
              Plumbing: 'Plumbing',
              HVAC: 'HVAC / Mechanical',
              Roof: 'Roofing / Gutters',
              Drainage: 'Landscaping / Site & Grounds',
              Windows: 'Windows / Exterior Sealant',
              Paint: 'Painting / Staining / Protective Coatings',
              Pest: 'Pest',
              Safety: 'Safety / Life Safety',
              Appliance: 'Appliances',
              Chimney: 'Roofing / Gutters',
              Exterior: 'Exterior & Site / Grounds',
              Carpentry: 'Carpentry / Decks / Fences',
              Landscape: 'Landscaping / Site & Grounds',
              'General Contractor': 'General Contractor / Remodel'
            }[trade];
            if (resourceCategory) return resourceCategory;
            if (item.category) return canonicalCategory(item.category, item);
            if (/(door|threshold|weatherstripping|hardware|hinge|latch|minor repair|adjustment)/.test(text)) return 'Handy Services';
            return 'Specialty / Other';
          }

          function categoryForChecklistItem(item = {}) {
            return categoryForLikelyResource(item);
          }

          function organizeChecklistRows(rows = []) {
            return rows
              .map((item, index) => ({ item, index, category: categoryForChecklistItem(item) }))
              .sort((a, b) => {
                const categoryDifference = categoryRank(a.category, a.item) - categoryRank(b.category, b.item);
                if (categoryDifference) return categoryDifference;
                const resourceA = displayTradeLabel(a.item.answer?.trade || a.item.trade || 'Review / Assign Later');
                const resourceB = displayTradeLabel(b.item.answer?.trade || b.item.trade || 'Review / Assign Later');
                const resourceDifference = resourceA.localeCompare(resourceB);
                return resourceDifference || a.index - b.index;
              })
              .map(entry => entry.item);
          }


          function CategoryBadge"""
          main, count = re.subn(r"function categoryForChecklistItem\(item = \{\}\) \{.*?\n\}\n\n\nfunction CategoryBadge", checklist_logic, main, count=1, flags=re.S)
          assert count == 1, f'Checklist category function replacement count was {count}'

          room_rows = "  const roomRows = rows.filter(r => r.sectionKey === activeRoom);"
          assert room_rows in main, 'roomRows definition not found'
          main = main.replace(room_rows, room_rows + "\n  const organizedRoomRows = organizeChecklistRows(roomRows);", 1)

          old_form_open = "    {view === 'form' && <main className=\"grid\">"
          new_form_open = """    {view === 'form' && <main className=\"htcPage\">
            <div className=\"pmrHeader htcTitleBar\"><div><p className=\"eyebrow\">HTC — Handy-Triage Checklist</p><h1>Room-by-Room Walkthrough</h1><p>Capture room conditions, likely resource, photos, and THA follow-up details before the PMR is prepared.</p></div><div className=\"compassCard\"><ClipboardCheck size={48}/><span>{activeRoomLabel}</span></div></div>
            <div className=\"grid htcGrid\">"""
          assert old_form_open in main, 'HTC main opening not found'
          main = main.replace(old_form_open, new_form_open, 1)

          old_map = "        {roomRows.map(r => {"
          new_map = "        {organizedRoomRows.map((r, index) => {"
          assert old_map in main, 'HTC roomRows map not found'
          main = main.replace(old_map, new_map, 1)

          meta_marker = "          const meta = categoryInfo(category);"
          meta_insert = meta_marker + "\n          const previousCategory = index > 0 ? categoryForChecklistItem(organizedRoomRows[index - 1]) : '';\n          const showCategoryHeader = previousCategory !== category;\n          const categoryItemCount = organizedRoomRows.reduce((count, item) => count + (categoryForChecklistItem(item) === category ? 1 : 0), 0);\n          const CategoryIcon = meta.Icon;"
          assert meta_marker in main, 'HTC category meta marker not found'
          main = main.replace(meta_marker, meta_insert, 1)

          old_return = "          return <div className={`itemCard checklistItemCard categoryCard category-${meta.slug} ${isExpanded ? 'expanded' : 'collapsed'} ${flags.some(flag => flag.className === 'attention') ? 'needsAttention' : ''} ${actionClass} rail-${rail.left} ${rail.right === 'work-now' ? 'rail-pass rail-work-now' : rail.right === 'pass' ? 'rail-pass' : ''}`} key={r.id}>"
          new_return = """          return <React.Fragment key={r.id}>
          {showCategoryHeader && <div className={`htcCategoryHeader category-${meta.slug}`}><div className=\"htcCategoryTitle\"><span className=\"passCategoryIcon\"><CategoryIcon size={18}/></span><h2>{meta.label}</h2></div><span>{categoryItemCount} line item{categoryItemCount === 1 ? '' : 's'}</span></div>}
          <div className={`itemCard checklistItemCard categoryCard category-${meta.slug} ${isExpanded ? 'expanded' : 'collapsed'} ${flags.some(flag => flag.className === 'attention') ? 'needsAttention' : ''} ${actionClass} rail-${rail.left} ${rail.right === 'work-now' ? 'rail-pass rail-work-now' : rail.right === 'pass' ? 'rail-pass' : ''}`}>"""
          assert old_return in main, 'HTC checklist return marker not found'
          main = main.replace(old_return, new_return, 1)

          old_summary_resource = "<span>{r.zone} · Suggested: {displayTradeLabel(r.trade)}</span>"
          new_summary_resource = "<span>{r.zone} · Likely resource: {displayTradeLabel(r.answer.trade || r.trade)}</span>"
          occurrences = main.count(old_summary_resource)
          assert occurrences == 1, f'Expected one collapsed resource line, found {occurrences}'
          main = main.replace(old_summary_resource, new_summary_resource, 1)

          old_expanded_resource = "<p>{r.zone} · Suggested: {displayTradeLabel(r.trade)}</p>"
          new_expanded_resource = "<p>{r.zone} · Likely resource: {displayTradeLabel(r.answer.trade || r.trade)}</p>"
          occurrences = main.count(old_expanded_resource)
          assert occurrences == 1, f'Expected one expanded resource line, found {occurrences}'
          main = main.replace(old_expanded_resource, new_expanded_resource, 1)

          old_map_close = "        </div>})}\n      </section>\n    </main>}\n    {view === 'pmr'"
          new_map_close = "        </div></React.Fragment>})}\n      </section>\n    </div></main>}\n    {view === 'pmr'"
          assert old_map_close in main, 'HTC map/wrapper closing marker not found'
          main = main.replace(old_map_close, new_map_close, 1)

          main_path.write_text(main)

          style_path = Path('src/style.css')
          style = style_path.read_text()
          style_marker = '/* --- V3.58.8.4 native HTC title and resource organization --- */'
          assert style_marker not in style, 'V3.58.8.4 style marker already exists'
          style += """

          /* --- V3.58.8.4 native HTC title and resource organization --- */
          .htcPage{max-width:1400px;margin:20px auto;padding:0 20px}
          .htcTitleBar{margin-bottom:0}
          .htcGrid{padding:20px 0}
          .htcCategoryHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 8px;padding:10px 13px;border:1px solid #d8e4e8;border-left:6px solid var(--gold);border-radius:15px;background:#f4f8fa;color:var(--navy);box-shadow:0 5px 14px rgba(11,54,88,.05)}
          .htcCategoryTitle{display:flex;align-items:center;gap:9px;min-width:0}
          .htcCategoryTitle h2{margin:0;font-size:17px;line-height:1.2;color:var(--navy)}
          .htcCategoryHeader>span{color:var(--muted);font-size:11px;font-weight:900;white-space:nowrap}
          .htcCategoryHeader+.checklistItemCard{margin-top:0!important}
          @media(max-width:900px){.htcPage{padding:0 12px}.htcGrid{padding-top:14px}.htcTitleBar{align-items:flex-start}.htcCategoryHeader{align-items:flex-start;flex-direction:column}.htcCategoryHeader>span{white-space:normal}}
          """
          style_path.write_text(style)

          overlay_path = Path('public/tha-v3587-react-safe-checklist-and-pass.js')
          overlay = overlay_path.read_text()
          old_layout = """      .formPanel{display:flex!important;flex-direction:column!important;min-width:0!important}
                .formPanel>h1{order:0}
                .formPanel>.roomCaptureShell{order:10}
                .formPanel>.checklistToolbar{order:20}
                .formPanel>.checklistItemCard{order:var(--tha-v3587-order,9999);margin-top:6px!important}"""
          new_layout = """      .formPanel{min-width:0!important}
                .formPanel>.checklistItemCard{margin-top:6px!important}"""
          assert old_layout in overlay, 'V3.58.7 HTC flex/order CSS block not found'
          overlay = overlay.replace(old_layout, new_layout, 1)
          assert '    decorateChecklist();\n' in overlay, 'decorateChecklist run call not found'
          overlay = overlay.replace('    decorateChecklist();\n', '', 1)
          overlay_path.write_text(overlay)
          PY

      - name: Install and validate build
        run: |
          npm ci
          npm run build

      - name: Commit focused corrections and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v35884-logo-htc-organization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/style.css public/tha-v3587-react-safe-checklist-and-pass.js .github/workflows/apply-v35884-logo-htc-organization.yml
          git commit -m "Restore header logo and organize HTC by likely resource"
          git push origin HEAD:feature/v3-58-native-start-snapshot-management
