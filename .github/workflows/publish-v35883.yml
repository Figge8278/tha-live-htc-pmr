name: Publish V3.58.8.3 Verified Static Preview

on:
  push:
    branches:
      - preview-v35883
    paths:
      - .github/workflows/publish-v35883.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: v35883-static-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preview source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build -- --base=./

      - name: Verify requested Start behavior in built files
        run: |
          test -f dist/index.html
          test -f dist/tha-v3588-start-source-separation.js
          grep -q 'thaV3588DriveNeeded' dist/tha-v3588-start-source-separation.js
          grep -q 'thaV3588DriveReady' dist/tha-v3588-start-source-separation.js
          grep -q 'button.disabled = !connected' dist/tha-v3588-start-source-separation.js
          grep -q '.demoScenarioCard { display:none!important; }' dist/tha-v3588-start-source-separation.js
          grep -q 'thaV3588DemoPanel' dist/tha-v3588-start-source-separation.js
          grep -q 'Choose Saved Walkthrough' dist/tha-v3588-start-source-separation.js

      - name: Publish immutable static build
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tha-v35883-site
          mkdir -p /tmp/tha-v35883-site
          cp -a dist/. /tmp/tha-v35883-site/
          touch /tmp/tha-v35883-site/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview-v35883-static
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/tha-v35883-site/. .
          git add -A
          git commit -m "Publish V3.58.8.3 static preview from 94b21cf53541c441ff2a5f2c9bde05e3ab711e76"
          STATIC_SHA="$(git rev-parse HEAD)"
          git push --force origin HEAD:preview-v35883-static
          echo "static_sha=${STATIC_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify public immutable URL and script
        id: public_check
        shell: bash
        env:
          STATIC_SHA: ${{ steps.publish.outputs.static_sha }}
        run: |
          set -euo pipefail
          BASE="https://rawcdn.githack.com/${GITHUB_REPOSITORY}/${STATIC_SHA}"
          PAGE_URL="${BASE}/index.html"
          SCRIPT_URL="${BASE}/tha-v3588-start-source-separation.js"
          for attempt in $(seq 1 15); do
            if curl -fLsS --connect-timeout 10 --max-time 30 "$PAGE_URL" -o /tmp/page.html && \
               curl -fLsS --connect-timeout 10 --max-time 30 "$SCRIPT_URL" -o /tmp/start.js; then
              break
            fi
            sleep 8
          done
          test -s /tmp/page.html
          test -s /tmp/start.js
          grep -q 'tha-v3588-start-source-separation.js' /tmp/page.html
          grep -q 'thaV3588DriveNeeded' /tmp/start.js
          grep -q 'thaV3588DriveReady' /tmp/start.js
          grep -q 'button.disabled = !connected' /tmp/start.js
          grep -q '.demoScenarioCard { display:none!important; }' /tmp/start.js
          grep -q 'thaV3588DemoPanel' /tmp/start.js
          grep -q 'activateDemo' /tmp/start.js
          echo "page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"

      - name: Report verified preview
        if: always()
        uses: actions/github-script@v7
        env:
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          PUBLIC_RESULT: ${{ steps.public_check.outcome }}
          PAGE_URL: ${{ steps.public_check.outputs.page_url }}
          STATIC_SHA: ${{ steps.publish.outputs.static_sha }}
        with:
          script: |
            const url = process.env.PAGE_URL || '(no verified public URL produced)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 74,
              body: `V3.58.8.3 verified preview — publish: ${process.env.PUBLISH_RESULT}; public check: ${process.env.PUBLIC_RESULT}; URL: ${url}; static SHA: ${process.env.STATIC_SHA || '(none)'}; source app commit: 94b21cf53541c441ff2a5f2c9bde05e3ab711e76; run: ${runUrl}`
            });
