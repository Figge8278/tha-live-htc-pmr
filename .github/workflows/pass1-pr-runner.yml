name: PASS 1 PR runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-pass1:
    if: "!contains(github.event.pull_request.title, '[pass1-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run PASS 1 builder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/pass1-build.yml').read_text()
          script = workflow.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(script, {})
          PY
          npm install
          npm run build
          git config user.name "THA App Builder"
          git config user.email "actions@github.com"
          git rm .github/workflows/pass1-build.yml .github/workflows/pass1-pr-runner.yml
          git add src/main.jsx src/style.css
          git commit -m "[pass1-applied] Add PASS tab and simplify walkthrough controls"
          git push
