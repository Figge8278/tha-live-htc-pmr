name: V3.58 Validation

on:
  push:
    branches:
      - feature/v3-58-native-start-snapshot-management
  pull_request:
    branches:
      - feature/v3-57-snapshot-source-of-truth-cleanup

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check V3.58 browser scripts
        run: |
          node --check public/tha-v358-start-and-management.js
          node --check public/tha-v358-management-resilience.js
      - name: Build application
        run: npm run build
