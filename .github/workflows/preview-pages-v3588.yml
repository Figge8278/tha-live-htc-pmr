name: Publish Public THA Snapshot Preview

on:
  push:
    branches:
      - preview-v3588
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: tha-public-static-preview
  cancel-in-progress: true

env:
  SOURCE_REF: 60e55a27e85e22fa49cdfa6320a0282c7078130a

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current V3.58 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public static preview with relative paths
        run: npm run build -- --base=./

      - name: Publish built files to isolated static branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tha-public-site
          mkdir -p /tmp/tha-public-site
          cp -a dist/. /tmp/tha-public-site/
          touch /tmp/tha-public-site/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview-v3588-static
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/tha-public-site/. .
          git add -A
          git commit -m "Publish public THA Snapshot preview from ${SOURCE_REF}"
          STATIC_SHA="$(git rev-parse HEAD)"
          git push --force origin HEAD:preview-v3588-static
          echo "static_sha=${STATIC_SHA}" >> "$GITHUB_OUTPUT"

      - name: Report public preview result
        if: always()
        uses: actions/github-script@v7
        env:
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          STATIC_SHA: ${{ steps.publish.outputs.static_sha }}
          SOURCE_SHA: ${{ env.SOURCE_REF }}
        with:
          script: |
            const sha = process.env.STATIC_SHA || '';
            const url = sha
              ? `https://rawcdn.githack.com/${context.repo.owner}/${context.repo.repo}/${sha}/index.html`
              : '(no public URL produced)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 74,
              body: `Public no-login preview — publish: ${process.env.PUBLISH_RESULT}; URL: ${url}; source app commit: ${process.env.SOURCE_SHA}; static SHA: ${sha || 'not produced'}; run: ${runUrl}`
            });
