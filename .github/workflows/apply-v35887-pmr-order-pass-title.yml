name: Apply V3.58.8.7 PMR Order and PASS Title

on:
  push:
    branches:
      - feature/v3-58-native-start-snapshot-management
    paths:
      - .github/workflows/apply-v35887-pmr-order-pass-title.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-58-native-start-snapshot-management
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct PMR lower-section order and PASS expansion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.jsx')
          source = path.read_text()

          action_block = '    <div className="noPrint pmrInternalActionList"><ThaActionTodoList rows={rows} roomCapture={roomCapture} sections={sections} passItems={passCatalogItems}/></div>\n'
          plan_block = '    <PassPlanSummary passCareOutlook={passCareOutlook} passReview={passReview} />\n'
          goals_marker = '    <CollapsibleBlock title="Homeowner Goals & Intake Context"'
          planning_marker = '    <CollapsibleBlock title="Planning Guides"'
          old_pass_title = '<p className="eyebrow">PASS — Preventative Maintenance Care Plan</p>'
          new_pass_title = '<p className="eyebrow">PASS — Precision Annual & Seasonal Services</p>'

          assert source.count(action_block) == 1, f'Expected one PMR THA action block, found {source.count(action_block)}'
          assert source.count(plan_block) == 1, f'Expected one PMR plan block, found {source.count(plan_block)}'
          assert source.count(goals_marker) == 1, f'Expected one homeowner goals marker, found {source.count(goals_marker)}'
          assert source.count(planning_marker) == 1, f'Expected one planning guides marker, found {source.count(planning_marker)}'
          assert source.count(old_pass_title) == 1, f'Expected one old PASS eyebrow, found {source.count(old_pass_title)}'

          source = source.replace(action_block, '', 1)
          source = source.replace(plan_block, '', 1)
          source = source.replace(goals_marker, plan_block + goals_marker, 1)
          source = source.replace(planning_marker, action_block + planning_marker, 1)
          source = source.replace(old_pass_title, new_pass_title, 1)

          trade = source.index('<section className="pmrBlock compactFindings"><h2><Wrench/> Trade-by-Trade Action List')
          detail = source.index('<CollapsibleBlock title="Detail Appendix"', trade)
          plan = source.index('<PassPlanSummary passCareOutlook={passCareOutlook} passReview={passReview} />', detail)
          goals = source.index('<CollapsibleBlock title="Homeowner Goals & Intake Context"', plan)
          action = source.index('<div className="noPrint pmrInternalActionList">', goals)
          planning = source.index('<CollapsibleBlock title="Planning Guides"', action)
          assert trade < detail < plan < goals < action < planning, 'PMR lower-section order is incorrect'
          assert old_pass_title not in source
          assert source.count(new_pass_title) == 1

          path.write_text(source)
          PY

          npm ci
          npm run build

          grep -Fq 'PASS — Precision Annual & Seasonal Services' src/main.jsx
          python - <<'PY'
          from pathlib import Path
          source = Path('src/main.jsx').read_text()
          markers = [
              '<section className="pmrBlock compactFindings"><h2><Wrench/> Trade-by-Trade Action List',
              '<CollapsibleBlock title="Detail Appendix"',
              '<PassPlanSummary passCareOutlook={passCareOutlook} passReview={passReview} />',
              '<CollapsibleBlock title="Homeowner Goals & Intake Context"',
              '<div className="noPrint pmrInternalActionList">',
              '<CollapsibleBlock title="Planning Guides"'
          ]
          positions = [source.index(marker) for marker in markers]
          assert positions == sorted(positions), positions
          PY

      - name: Commit focused correction and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v35887-pmr-order-pass-title.yml
          git add src/main.jsx
          git commit -m "Reorder PMR closing sections and correct PASS expansion"
          git push origin HEAD:feature/v3-58-native-start-snapshot-management
