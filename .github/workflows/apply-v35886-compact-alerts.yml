name: Apply V3.58.8.6 Compact Headers and Reference Alerts

on:
  push:
    branches:
      - feature/v3-58-native-start-snapshot-management
    paths:
      - .github/workflows/apply-v35886-compact-alerts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3-58-native-start-snapshot-management
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused UI corrections
        run: python .github/scripts/apply_v35886.py

      - name: Validate scripts and application build
        run: |
          node --check public/tha-quick-intake-accordion.js
          node --check public/tha-v53-pmr-reference-and-expandable-items.js
          npm ci
          npm run build

      - name: Commit focused corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/style.css public/tha-quick-intake-accordion.js public/tha-v53-pmr-reference-and-expandable-items.js
          git commit -m "Compact HTC headers and surface required home references"
          git rm .github/workflows/apply-v35886-compact-alerts.yml .github/scripts/apply_v35886.py
          git commit --amend --no-edit
          git push origin HEAD:feature/v3-58-native-start-snapshot-management
